name: Release PacketPanther

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcap-dev upx-ucl

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build Linux amd64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -o dist/ppanther-linux-amd64 -ldflags "-X main.version=${{ env.VERSION }}" ./cmd/ppanther
          upx -9 dist/ppanther-linux-amd64

      - name: Build Linux arm64
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=1 go build -o dist/ppanther-linux-arm64 -ldflags "-X main.version=${{ env.VERSION }}" ./cmd/ppanther
          upx -9 dist/ppanther-linux-arm64

      - name: Build macOS amd64
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -o dist/ppanther-darwin-amd64 -ldflags "-X main.version=${{ env.VERSION }}" ./cmd/ppanther
          upx -9 dist/ppanther-darwin-amd64

      - name: Build macOS arm64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -o dist/ppanther-darwin-arm64 -ldflags "-X main.version=${{ env.VERSION }}" ./cmd/ppanther
          upx -9 dist/ppanther-darwin-arm64

      - name: Build Windows amd64
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go build -o dist/ppanther-windows-amd64.exe -ldflags "-X main.version=${{ env.VERSION }}" ./cmd/ppanther
          upx -9 dist/ppanther-windows-amd64.exe

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ppanther-linux-amd64
            dist/ppanther-linux-arm64
            dist/ppanther-darwin-amd64
            dist/ppanther-darwin-arm64
            dist/ppanther-windows-amd64.exe
            scripts/install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/packet-panther:latest
            ghcr.io/${{ github.repository_owner }}/packet-panther:${{ env.VERSION }}
